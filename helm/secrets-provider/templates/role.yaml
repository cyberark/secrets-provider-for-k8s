{{- if and .Values.rbac.create (ne (include "conjur.useClusterScopedRBAC" .) "true") }}
apiVersion: {{ include "conjur.rbac-api" . }}
kind: Role
metadata:
  name: {{ .Values.rbac.roleName }}
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    {{- if eq .Values.containerMode "standalone" }}
    verbs: ["get", "update", "list", "watch"]
    {{- else }}
    verbs: ["get", "update"]
    {{- end }}
{{- end }}
