# This app is created to run end-to-end tests with the Secrets Provider Job to ensure the updated K8s Secret appear as
# environment variables
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: test-env
  name: test-env
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-env
  template:
    metadata:
      labels:
        app: test-env
      annotations:
        conjur.org/automatic-restart: "true"
    spec:
      serviceAccountName:  {{ SERVICE_ACCOUNT }}
      containers:
      - image: {{ TEST_APP_IMAGE }}
        name: test-app
        command: ["sleep"]
        args: ["infinity"]
        securityContext:
          allowPrivilegeEscalation: false
        env:
        - name: TEST_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ K8S_SECRET }}
              key: secret
