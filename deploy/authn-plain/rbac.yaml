---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-provider-sa
  namespace: secrets-provider
---
# Role granting get/update on secrets in the target namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secrets-provider-role
  namespace: secrets-provider
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secrets-provider-rolebinding
  namespace: secrets-provider
subjects:
  - kind: ServiceAccount
    name: secrets-provider-sa
    namespace: secrets-provider
roleRef:
  kind: Role
  name: secrets-provider-role
  apiGroup: rbac.authorization.k8s.io
