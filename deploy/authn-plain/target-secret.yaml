---
# Target K8s Secret that Secrets Provider will populate with Conjur secrets.
# The conjur-map key maps desired data keys to Conjur variable IDs.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: secrets-provider
  labels:
    conjur.org/managed-by-provider: "true"
type: Opaque
stringData:
  conjur-map: |-
    db-username: apps/myapp/db-username
    db-password: apps/myapp/db-password
