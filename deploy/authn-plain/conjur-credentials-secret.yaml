---
# This Secret holds the Conjur host identity and API key used by the
# Secrets Provider CronJob to authenticate via plain authn.
apiVersion: v1
kind: Secret
metadata:
  name: conjur-credentials
  namespace: secrets-provider
type: Opaque
stringData:
  login: "host/apps/myapp"
  api-key: "REPLACE_WITH_YOUR_API_KEY"
